<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f3f4f7;--panel:#ffffff;--ink:#1f2330;--muted:#6b7280;--line:#e2e5ea;--accent:#30767A;--busy:rgba(255,255,255,.7)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "DejaVu Sans",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 180px}
.brand h1{margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
button,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover:not(:disabled),select:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled,select:disabled{opacity:.4;cursor:default}
.arrow{width:36px;height:32px;font-size:16px;padding:0}
#pageSel{max-width:200px}
#clusterSel{max-width:170px}
.count{color:var(--muted);font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:12px;background:#c9ced6;position:relative;cursor:pointer;transition:background .15s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:23px}
.lab{color:var(--muted)}
.lab.on{color:var(--ink);font-weight:700}
.sz{display:flex;align-items:center;gap:6px;color:var(--muted)}
.sz input{width:70px;accent-color:var(--accent)}
main{flex:1;display:grid;grid-template-columns:clamp(250px,19vw,320px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0;padding:8px 10px;gap:8px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.right{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
#barsBox{position:relative;flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#bars{position:absolute;inset:6px 10px 4px 6px}
.stage{position:relative;flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#plot{position:absolute;inset:0}
#busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--busy);color:var(--muted);font-size:16px;z-index:5}
.stage.loading #busy{display:flex}
.right>[hidden]{display:none!important}
.seg{gap:0}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ctl{display:flex;flex:none;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;color:var(--muted)}
.ctl select{padding:3px 6px}
.ctl .sz input{width:110px}
#pAzV,#pElV{min-width:40px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:12px;line-height:1.35}
.sec[hidden]{display:none}
.shead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px}
.shead b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.shead span{flex:none;white-space:nowrap}
.shead button{padding:3px 8px;font-size:13px}
.q{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin-bottom:6px}
.chip{display:flex;align-items:center;gap:8px;padding:2px 6px;border-radius:6px;cursor:pointer;user-select:none;font-size:14px;min-width:0}
.chip:hover{background:var(--bg)}
.chip input{margin:0;flex:none;accent-color:var(--accent);pointer-events:none}
.chip i{flex:none;width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.chip i.plain{background:transparent!important;box-shadow:inset 0 0 0 1.5px #9aa1ad}
.chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .n{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip.off{opacity:.4}
.chip .st{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:-1px}
.find{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.find input{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;flex:1;min-width:0;width:auto}
.find input.miss{border-color:#c0504d;background:#fdf1f0}
.corner{position:absolute;top:6px;left:8px;z-index:2;padding:2px 9px;font-size:12px}
.corner.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#sizeV{min-width:24px;font-variant-numeric:tabular-nums}
.found{margin-top:4px;padding:6px 8px;border-radius:8px;background:var(--bg);font-size:13px;word-break:break-all}
.found[hidden]{display:none}
@media (max-width:900px){html,body{height:auto}body{overflow:auto}main{grid-template-columns:1fr;grid-template-rows:auto auto}aside{max-height:45vh}.stage{flex:none;height:900px}#barsBox{flex:none;height:600px}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1 id="h1"></h1><div class="sub" id="sub"></div></div>
  <div class="group">
    <button id="prev" class="arrow" title="Previous page (←)" aria-label="Previous page">&#9664;</button>
    <select id="pageSel" aria-label="Page"></select>
    <span id="count" class="count"></span>
    <button id="next" class="arrow" title="Next page (→)" aria-label="Next page">&#9654;</button>
  </div>
  <div class="group">
    <label class="switch" title="Toggle colouring (C)"><span id="labS" class="lab">Species</span><input type="checkbox" id="toggle" aria-label="Colour by cluster"><span id="labC" class="lab">Cluster</span></label>
    <select id="clusterSel" aria-label="Cluster labels"></select>
  </div>
  <div class="group seg" role="group" aria-label="View"><button data-view="3d" title="3D scatter (V cycles views)">3D</button><button data-view="2d" title="2D projection of the 3D layouts">2D</button><button data-view="bars" title="Protein count per inter-species cluster">Bars</button></div>
  <div class="group">
    <label class="sz" title="Point size">Size <input type="range" id="size" min="0.5" max="8" step="0.5"><span id="sizeV"></span></label>
    <button id="reset" title="Reset camera">&#10226; View</button>
  </div>
</header>
<main>
  <aside id="side">
    <div><div class="find"><input id="find" type="search" placeholder="Find protein ID…" aria-label="Find protein ID" autocomplete="off"><button id="exportIds" title="Download the IDs of the points shown">&#10515; IDs</button></div><div id="linfo" class="muted"></div><div class="muted">click toggles · double-click isolates · click a bar shows its cluster<br>← → pages · V view · C colouring · L log bars · / find</div><div id="found" class="found" hidden></div></div>
    <section class="sec" id="secSp"><div class="shead"><b>Species</b><span><button data-all="sp">All</button> <button data-none="sp">None</button></span></div><input class="q" id="qSp" placeholder="Filter species…" aria-label="Filter species"><div id="listSp"></div></section>
    <section class="sec" id="secCl"><div class="shead"><b id="clTitle"></b><span><button id="selBtn" title="Tick only the joint clusters selected by the report (re-projected)">Sel</button> <button data-all="cl">All</button> <button data-none="cl">None</button></span></div><input class="q" id="qCl" placeholder="Filter clusters…" aria-label="Filter clusters"><div id="listCl"></div></section>
  </aside>
  <div class="right">
    <div id="barsBox"><button id="logBtn" class="corner" title="Toggle log scale (L)">log</button><div id="bars"></div></div>
    <div id="ctl2d" class="ctl" hidden><label>X <select id="pX" aria-label="X dimension"></select></label><label>Y <select id="pY" aria-label="Y dimension"></select></label><label class="sz">Azimuth <input type="range" id="pAz" min="-180" max="180" step="5"><span id="pAzV"></span></label><label class="sz">Elevation <input type="range" id="pEl" min="-90" max="90" step="5"><span id="pElV"></span></label><button id="pDef" title="Dimension 1 vs 2, no rotation">Default</button></div>
    <div class="stage" id="stage"><div id="plot"></div><div id="busy">Rendering…</div></div>
  </div>
</main>
<script>__PLOTLYJS__</script>
<script id="payload" type="application/json">__DATA__</script>
<script>

    el.innerHTML = `<input type="checkbox" tabindex="-1"${off ? "" : " checked"}><i class="${coloured ? "" : "plain"}" style="background:${col}"></i><span class="nm"></span><span class="st">${st}</span><span class="n">${cnt.toLocaleString()}</span>`;
    el.querySelector(".nm").textContent = nm;
    el.onclick = () => chip(s, i, order(cats, s === "cl"));
    return el;
  });
}
function sidebar(p, n) {
  const spCats = p.sets.species.cats;
  S.n = n;
  $("linfo").textContent = `${n.toLocaleString()} / ${p._s.species.length.toLocaleString()} points shown`;
  $("secSp").hidden = order(spCats, false).filter(i => i > 0).length < 2;
  $("clTitle").textContent = S.cluster;
  $("listSp").replaceChildren(...checklist("sp", spCats, !S.byCluster));
  $("listCl").replaceChildren(...checklist("cl", p.sets[S.cluster].cats, S.byCluster));
}
let timer = null;
function chip(s, i, all) {
  if (timer) { clearTimeout(timer); timer = null; S.hidden[s] = new Set(all.filter(j => j !== i)); draw(); return; }
  timer = setTimeout(() => { timer = null; S.hidden[s].has(i) ? S.hidden[s].delete(i) : S.hidden[s].add(i); draw(); }, 240);
}
function isolate(name) {
  const p = page(), cats = p.sets[D.leiden_key].cats, i = cats.findIndex(c => c[0] === name);
  if (i < 0) return;
  if (S.view === "bars") { S.view = S.last; S.fit = true; syncView(); }
  const all = order(cats, true), only = S.cluster === D.leiden_key && S.hidden.cl.size === all.length - 1 && !S.hidden.cl.has(i);
  S.cluster = D.leiden_key; $("clusterSel").value = S.cluster; S.byCluster = true; S.q.cl = ""; $("qCl").value = "";
  S.hidden.cl = only ? new Set() : new Set(all.filter(j => j !== i));
  sync(); draw();
}
function find(q) {
  const p = page(); q = q.trim().toLowerCase(); S.find = null;
  if (q) {
    let i = p._ids.findIndex(id => id.toLowerCase() === q);
    if (i < 0) i = p._ids.findIndex(id => id.toLowerCase().includes(q));
    if (i >= 0) { S.find = i; S.hidden.sp.delete(p._s.species[i]); S.hidden.cl.delete(p._s[S.cluster][i]); }
  }
  $("find").classList.toggle("miss", !!q && S.find === null);
  $("found").hidden = S.find === null;
  if (S.find !== null) $("found").innerHTML = p._h[S.find];
  draw();
}
function exportIds() {
  const p = page(), a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([S.keep.map(i => p._ids[i]).join("\n") + "\n"], {type: "text/plain"}));
  a.download = `${p.slug}_${key().replace(/\W+/g, "_")}_${S.keep.length}_ids.txt`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function defaults() {
  const p = P[S.page], sel = new Set(p.selected || []), cats = p.sets[D.leiden_key].cats;
  $("selBtn").hidden = !sel.size;
  if (!sel.size) return;
  S.cluster = D.leiden_key; $("clusterSel").value = S.cluster; S.byCluster = true; S.q.cl = ""; $("qCl").value = "";
  S.hidden.cl = new Set(cats.map((_, i) => i).filter(i => !sel.has(cats[i][0])));
}
function unfilter(s) { (s ? [s] : ["sp", "cl"]).forEach(k => { S.hidden[k].clear(); S.q[k] = ""; $(k === "sp" ? "qSp" : "qCl").value = ""; }); }
function sync() {
  const p = P[S.page];
  $("pageSel").value = S.page; $("prev").disabled = S.page === 0; $("next").disabled = S.page === P.length - 1;
  $("count").textContent = `${S.page + 1} / ${P.length}`; $("h1").textContent = p.title; $("sub").textContent = p.subtitle;
  $("toggle").checked = S.byCluster; $("clusterSel").disabled = !S.byCluster;
  $("labS").classList.toggle("on", !S.byCluster); $("labC").classList.toggle("on", S.byCluster);
  try { history.replaceState(null, "", "#" + (S.page + 1)); } catch (e) {}
}
function go(i) { if (i < 0 || i >= P.length || i === S.page) return; S.page = i; S.find = null; $("find").value = ""; $("find").classList.remove("miss"); $("found").hidden = true; unfilter(); defaults(); sync(); draw(); }
function syncView() {
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === S.view));
  $("barsBox").hidden = S.view !== "bars"; $("stage").hidden = S.view === "bars"; $("ctl2d").hidden = S.view !== "2d";
  $("size").disabled = S.view === "bars"; $("reset").disabled = S.view === "bars"; $("reset").title = S.view === "3d" ? "Reset camera" : "Reset zoom";
}
function setView(v) { if (v === S.view) return; S.view = v; if (v !== "bars") S.last = v; S.fit = true; syncView(); draw(); }
function syncProj() { const pr = S.proj; $("pX").value = pr.x; $("pY").value = pr.y; $("pAz").value = pr.az; $("pEl").value = pr.el; $("pAzV").textContent = pr.az + "°"; $("pElV").textContent = pr.el + "°"; }
function setAxis(w, v) { const o = w === "x" ? "y" : "x"; if (S.proj[o] === v) S.proj[o] = S.proj[w]; S.proj[w] = v; syncProj(); draw(); }
function colourBy(cluster) { S.byCluster = cluster; sync(); draw(); }
document.title = D.title;
$("pageSel").replaceChildren(...P.map((p, i) => new Option(`${i + 1}. ${p.title}`, i)));
$("clusterSel").replaceChildren(...D.cluster_keys.map(k => new Option(k, k)));
["pX", "pY"].forEach(id => $(id).replaceChildren(...[0, 1, 2].map(d => new Option(`dim ${d + 1}`, d))));
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view));
$("pX").onchange = e => setAxis("x", +e.target.value);
$("pY").onchange = e => setAxis("y", +e.target.value);
["pAz", "pEl"].forEach(id => { $(id).oninput = e => { S.proj[id === "pAz" ? "az" : "el"] = +e.target.value; syncProj(); }; $(id).onchange = () => draw(); });
$("pDef").onclick = () => { S.proj = {x: 0, y: 1, az: 0, el: 0}; syncProj(); draw(); };
$("size").value = S.size; $("sizeV").textContent = S.size;
$("prev").onclick = () => go(S.page - 1);
$("next").onclick = () => go(S.page + 1);
$("pageSel").onchange = e => go(+e.target.value);
$("toggle").onchange = e => colourBy(e.target.checked);
$("clusterSel").onchange = e => { S.cluster = e.target.value; unfilter("cl"); draw(); };
$("size").oninput = e => { S.size = +e.target.value; $("sizeV").textContent = S.size; Plotly.restyle($("plot"), {"marker.size": S.view === "2d" ? S.size * 2 : S.size}, P[S.page].methods.map((_, j) => j)); };
$("logBtn").onclick = () => { S.log = !S.log; bars(page()); };
$("find").onkeydown = e => { if (e.key === "Enter") find(e.target.value); else if (e.key === "Escape") { e.target.value = ""; find(""); e.target.blur(); } };
$("find").onsearch = e => { if (!e.target.value) find(""); };
$("exportIds").onclick = exportIds;
$("selBtn").onclick = () => { defaults(); sync(); draw(); };
$("reset").onclick = () => { S.rev++; S.cam = {}; draw(); };
document.querySelectorAll("[data-all]").forEach(b => b.onclick = () => { shown(b.dataset.all).forEach(i => S.hidden[b.dataset.all].delete(i)); draw(); });
document.querySelectorAll("[data-none]").forEach(b => b.onclick = () => { shown(b.dataset.none).forEach(i => S.hidden[b.dataset.none].add(i)); draw(); });
$("qSp").oninput = e => { S.q.sp = e.target.value; sidebar(page(), S.n); };
$("qCl").oninput = e => { S.q.cl = e.target.value; sidebar(page(), S.n); };
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || (["INPUT", "SELECT"].includes(e.target.tagName) && e.target.type !== "checkbox")) return;
  if (e.key === "ArrowLeft") go(S.page - 1);
  else if (e.key === "ArrowRight") go(S.page + 1);
  else if (e.key === "c" || e.key === "C") colourBy(!S.byCluster);
  else if (e.key === "l" || e.key === "L") { S.log = !S.log; if (S.view === "bars") bars(page()); }
  else if (e.key === "v" || e.key === "V") setView(["3d", "2d", "bars"][(["3d", "2d", "bars"].indexOf(S.view) + 1) % 3]);
  else if (e.key === "/") { e.preventDefault(); $("find").focus(); }
});
let rt = null;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { const st = innerWidth < 900; if (st !== S.stacked) { S.stacked = st; draw(); } else if (S.view === "bars") bars(page()); }, 200); });
const h = parseInt(location.hash.slice(1), 10);
S.page = h >= 1 && h <= P.length ? h - 1 : 0;
defaults(); syncView(); syncProj(); sync(); draw();
</script>
</body>
