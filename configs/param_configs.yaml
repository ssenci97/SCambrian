dw_uniprot_features:
  config_path: configs/query_configs.tsv
  features_out_dir: data/features
  overwrite: false
dw_uniprot_seqs:
  config_path: configs/query_configs.tsv
  seq_out_dir: data/sequences
  overwrite: false
extract_reps_biohub:
  batch_size: 500
  model_name:
  - esmc_300m
  - esmc_600m
  - esmc_6b
  reps_outdir: data/esm-reps
  overwrite: false
npz_scanpy:
  seed: 42
  resolution: 1.0
  n_neighbors: 15
  n_pcs: null
  n_components:
  - 2
  - 3
  min_dist: 0.5
  perplexity: 30.0
  max_iter: 1000
  outdir: data/scanpy/
  overwrite: false
run_mmseqs2:
  clusters_out_dir: data/clusters
  dedup_out_dir: data/dedup
  mmseqs:
    clust_cov: 0.8
    clust_cov_mode: 0
    dedup_cov: 0.8
    dedup_cov_mode: 0
    dedup_min_seq_id: 0.9
    thresholds:
    - 0.9
    - 0.8
    - 0.7
    - 0.6
    - 0.5
    - 0.4
    - 0.3
    - 0.2
  mmseqs_path: mmseqs
  overwrite: false
  seq_out_dir: data/sequences
h5ad_scanpy:
  methods:
  - umap
  - tsne
  max_joint_labels: 6
  min_joint_size: 100
  min_intra_size: 150
  min_module_size: 200
  min_percent_enrichment: 80
  overwrite: false
h5ad_interactive:
  mcs_grid:
  - 50
  - 100
  - 200
  - 400
  - 800
  - 1600
  min_samples: 10
  max_clusters: 15
  max_points: null
  overwrite: false
