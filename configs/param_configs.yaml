run_mmseqs2:
  mmseqs_path: mmseqs
  seq_in_dir: data/sequences
  dedup_out_dir: data/dedup
  clusters_out_dir: data/clusters
  dedup_min_seq_id: 0.9
  dedup_cov: 0.8
  dedup_cov_mode: 0
  clust_cov: 0.8
  clust_cov_mode: 0
  thresholds:
  - 0.9
  - 0.8
  - 0.7
  - 0.6
  - 0.5
  - 0.4
  - 0.3
  - 0.2
  threads: null
extract_reps_biohub:
  model_names:
  - esmc_300m
  - esmc_600m
  - esmc_6b
  batch_size: 500
  chunk_size: 500
  reps_outdir: data/esm-reps
extract_contacts_biohub:
  batch_size: 300
  max_tokens: 10000
  min_sep: 6
  contacts_outdir: data/esm-contacts/esmc_6b
npz_tsne:
  seed: 42
  n_components: 2
  perplexity: 30.0
  max_iter: 1000
  learning_rate: auto
  early_exaggeration: 12.0
  metric: euclidean
  init: pca
  n_jobs: -1
  output_dir: data/dimred
npz_umap:
  seed: 42
  n_components: 2
  n_neighbors: 15
  min_dist: 0.1
  metric: euclidean
  n_epochs: null
  learning_rate: 1.0
  init: spectral
  n_jobs: -1
  output_dir: data/dimred
npz_scanpy:
  seed: 42
  resolution: 1.0
  n_neighbors: 15
  n_pcs: null
  min_module_size: 100
  min_percent_enrichment: 80
  outdir: data/scanpy/
dw_uniprot_seqs:
  config_path: configs/query_configs.tsv
  seq_out_dir: data/sequences
  timeout: 600
dw_uniprot_features:
  config_path: configs/query_configs.tsv
  features_out_dir: data/features
  timeout: 600
